# ==============================================================================
# KEERTI COUTURE — MULTI-CONTAINER LOCAL & STAGING DEPLOYMENT
# ==============================================================================

version: '3.8'

services:
  # ── MongoDB Persistent Database ─────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: keerti_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - keerti_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Node.js / Express Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keerti_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/tailor_shop
      - JWT_SECRET=${JWT_SECRET:-keerti_couture_production_jwt_secret_min_32_chars_2026}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - TRUST_PROXY=true
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-your_cloudinary_cloud_name}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-your_cloudinary_api_key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-your_cloudinary_api_secret}
      - SMTP_HOST=${SMTP_HOST:-smtp.your-email-provider.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your_smtp_username}
      - SMTP_PASS=${SMTP_PASS:-your_smtp_password}
      - FROM_EMAIL="Keerti Couture Atelier" <concierge@keerticouture.com>
      - BUSINESS_WHATSAPP=919945804019
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - keerti_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Next.js 16 Frontend Web Application ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: keerti_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - keerti_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo_data:
    driver: local

networks:
  keerti_network:
    driver: bridge
